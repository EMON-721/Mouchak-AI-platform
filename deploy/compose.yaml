# Provider-neutral complete service topology; intentionally not deployed.
# Provision dedicated PostgreSQL roles first; provide private S3/SMTP and secrets.
# docker compose --env-file .env -f deploy/compose.yaml up -d --build
services:
  model-init:
    extends: {file: compose.backend.yaml, service: model-init}
  signatures-init:
    extends: {file: compose.backend.yaml, service: signatures-init}
  signatures:
    extends: {file: compose.backend.yaml, service: signatures}
  api:
    extends: {file: compose.backend.yaml, service: api}
    environment:
      PORT: "8000"
  inference:
    extends: {file: compose.backend.yaml, service: inference}
  scheduler:
    extends: {file: compose.backend.yaml, service: scheduler}
  retention:
    extends: {file: compose.backend.yaml, service: retention}
  web:
    build: {context: .., dockerfile: deploy/Dockerfile.web}
    environment:
      NODE_ENV: production
      PRIVATE_API_URL: http://api:8000
      PRIVATE_API_TOKEN: ${PRIVATE_API_TOKEN:?required}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    init: true
    depends_on: [api]
  tls:
    image: caddy:2-alpine
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?required}
      TLS_EMAIL: ${TLS_EMAIL:?required}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile.web:/etc/caddy/Caddyfile:ro", "tls-data:/data", "tls-config:/config"]
    restart: unless-stopped
    depends_on: [web]
volumes:
  private-state:
  model-weights:
  malware-signatures:
  tls-data:
  tls-config:

name: Mouchak checks
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  NEXT_TELEMETRY_DISABLED: '1'
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/check-public-source.py --history
      - run: python3 scripts/generate-api-reference.py --check
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test:portable
      - run: node scripts/test-site-presentation.mjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ben ffmpeg fonts-dejavu-core
      - run: pip install -r requirements-python.txt
      - run: python scripts/check-registry.py
      - run: python scripts/download-models.py
      - run: python scripts/download-noise.py
      - run: python scripts/download-pose.py --test-fixture
      - uses: actions/cache@v4
        with:
          path: |
            models/whisper-small-bn
            .state/model-sources/arijitx-whisper-small-bn
            .state/datasets/openslr37
            .state/evaluation/reading-speech
          key: bn-speech-slr37-small-061641-ct2484-canonical-v1
      - name: Prepare pinned Bengali Small and fixed licensed Bangladesh speech clips
        run: |
          python -m venv .state/conversion-venv
          .state/conversion-venv/bin/pip install -r requirements-reading-conversion.txt
          .state/conversion-venv/bin/python scripts/download-reading-speech.py
          python scripts/prepare-bn-speech.py
      - run: python -m pytest tests --ignore=tests/verify_postgres.py -q --junitxml=ci-results.xml
      - run: node scripts/test-postgres.mjs
      - run: node scripts/test-collaboration-postgres.mjs
      - run: node scripts/test-async-postgres.mjs
      - run: node scripts/test-private-processing.mjs
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-evidence, path: ci-results.xml}
  private-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install integration-controller dependencies
        run: pip install psycopg[binary]==3.3.6 cryptography==50.0.2 boto3==1.43.119 httpx==0.28.1 Pillow==12.3.0 argon2-cffi==25.1.0 osmium==4.3.0
      - uses: actions/cache@v4
        with:
          path: |
            .state/datasets/osm
            .state/public-datasets
          key: bd-public-roads-20261028-osmium430-v1
      - name: Verify isolated TLS database, storage, scanner, roles and model containers
        run: python scripts/test-production-stack.py
      - name: Validate all portable Compose topologies without provisioning services
        run: python scripts/check-compose-config.py
      - name: Build canonical standalone web image
        run: docker build --file deploy/Dockerfile.web --tag mouchak-web:ci .
      - name: Verify actual non-root web image and absent-backend failure
        run: python scripts/test-web-image.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: private-stack-evidence, path: docs/audit/production-stack.json}
